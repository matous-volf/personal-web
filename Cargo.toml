[package]
name = "personal_web"
version = "0.1.0"
edition = "2024"

[dependencies]
async-std = "1.13.2"
dioxus = { version = "0.7.9", features = ["router", "fullstack"] }
dioxus-sdk = { version = "0.7.0", features = ["storage"] }
fluent-langneg = { version = "0.14.2", optional = true }
icu_locid = { version = "1.5.0", optional = true }
load-dotenv = "0.1.2"
serde = { version = "1.0.229" }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server", "dep:fluent-langneg", "dep:icu_locid"]
